<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">claude-code theme for OpenCode</title>
  <desc id="heroDesc">Dark warm OpenCode theme inspired by Claude Code: cream text on near-black brown with terracotta orange accents.</desc>

  <rect width="1200" height="400" rx="24" fill="#1E1C1A"/>
  <rect x="1.5" y="1.5" width="1197" height="397" rx="23" fill="none" stroke="#4A4540" stroke-width="2"/>

  <!-- Title block -->
  <g id="title-block" transform="translate(64 64)">
    <text x="0" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" letter-spacing="4" fill="#8A837B">OPENCODE · DARK TUI THEME</text>
    <text x="0" y="88" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="72" font-weight="700" fill="#EDE9E3">claude-code</text>
    <text x="0" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" fill="#B8B0A7">Warm cream + terracotta for OpenCode,</text>
    <text x="0" y="162" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" fill="#B8B0A7">inspired by Claude Code.</text>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#8A837B">
      <text x="0" y="212">dark-only · OpenCode V2 · MIT</text>
    </g>
    <!-- palette strip -->
    <g id="palette" transform="translate(0 236)">
      <g>
        <rect width="150" height="56" rx="10" fill="#262320" stroke="#4A4540" stroke-width="1.5"/>
        <rect x="12" y="12" width="32" height="32" rx="6" fill="#EDE9E3"/>
        <text x="52" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#D5CFC6">#EDE9E3</text>
      </g>
      <g transform="translate(162 0)">
        <rect width="150" height="56" rx="10" fill="#262320" stroke="#4A4540" stroke-width="1.5"/>
        <rect x="12" y="12" width="32" height="32" rx="6" fill="#D97757"/>
        <text x="52" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#D5CFC6">#D97757</text>
      </g>
      <g transform="translate(324 0)">
        <rect width="150" height="56" rx="10" fill="#262320" stroke="#4A4540" stroke-width="1.5"/>
        <rect x="12" y="12" width="32" height="32" rx="6" fill="#F5B79E"/>
        <text x="52" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#D5CFC6">#F5B79E</text>
      </g>
    </g>
  </g>

  <!-- Terminal proof -->
  <g id="terminal-proof" transform="translate(700 56)">
    <rect width="436" height="288" rx="16" fill="#262320" stroke="#4A4540" stroke-width="2"/>
    <circle cx="32" cy="30" r="8" fill="#E07868"/>
    <circle cx="58" cy="30" r="8" fill="#EFC88A"/>
    <circle cx="84" cy="30" r="8" fill="#9AD8A8"/>
    <line x1="16" y1="52" x2="420" y2="52" stroke="#4A4540" stroke-width="1.5"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21">
      <text x="28" y="92" fill="#D97757">$ <tspan fill="#EDE9E3">opencode</tspan><tspan fill="#D97757"> ▊</tspan></text>
      <text x="28" y="130" fill="#8A837B"># theme: claude-code</text>
      <text x="28" y="168" fill="#F5B79E">keyword <tspan fill="#9ABDDD">function()</tspan> <tspan fill="#9AD8A8">"string"</tspan></text>
      <text x="28" y="206" fill="#9AD8A8">+ added line</text>
      <text x="28" y="244" fill="#F2A89B">- removed line</text>
      <text x="28" y="282" fill="#8A837B">◇ 3 files changed</text>
    </g>
  </g>
</svg>
